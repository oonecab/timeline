[package]
name = "timeline"
version = "1.2.0"
edition = "2024"
rust-version = "1.85"
description = "Persistent branching conversation timelines with reversible summaries and a stdio MCP server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
tempfile = "3"

[dev-dependencies]
roxmltree = "0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory"] }
